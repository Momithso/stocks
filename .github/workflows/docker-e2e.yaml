name: Docker e2e Test

on:
  pull_request: {}

env:
  IMAGE_REGISTRY: ghcr.io
  # lower case, docker does not accept the upper case letters of the repository owner
  IMAGE_PATH: fsr5-fhaachen/stocks
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_PATH }}:latest
      - name: Create Environment
        run: |
          cat > .env << EOF
          APP_ENV=local
          # exactly 32 bytes (aes-256-cbc): "e2e-only-key-not-secret-32bytes!"
          APP_KEY=base64:ZTJlLW9ubHkta2V5LW5vdC1zZWNyZXQtMzJieXRlcyE=
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          APP_FORCE_HTTPS=false
          OCTANE_HTTPS=false
          OCTANE_WORKERS=1
          SETUP_TOKEN=e2e-setup
          DB_PASSWORD=e2e-password
          REDIS_PASSWORD=e2e-password
          MAIL_MAILER=log
          EOF
      - name: Run Image
        uses: isbang/compose-action@v2.0.1
        with:
          compose-file: "docker-compose.yaml"
          down-flags: "--volumes"
      - name: Wait for the web server
        run: |
          # Octane starts only after the migrations (see CMD in the Dockerfile), so any HTTP answer
          # means the database is migrated. Timeout after 3 minutes
          timeout 180 bash -c 'until [ "$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:8000)" != "000" ]; do printf "."; sleep 5; done'
      - name: Set up the instance
        run: |
          # the image migrates on start; set up the instance without the wizard
          docker compose exec -T web php artisan stocks:install --name=E2E --admin-email=e2e@example.com --admin-password=e2e-long-password
      - name: Debug
        run: |
          curl http://localhost:8000
      - name: Test reachable
        run: |
          # test every 10 seconds if http://localhost:8000 is reachable and has a OK status code. Timeout after 2 minutes
          timeout 120 bash -c 'until curl --output /dev/null --silent --head --fail http://localhost:8000; do printf "."; sleep 10; done'
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 web mariadb
