# One Stocks instance. Every value that differs between instances comes from the .env file next
# to this file, see documentation/SETUP.md. STOCKS_IMAGE pins another image (the dev server uses
# the image of the deployed commit, see documentation/DEPLOY.md).

# environment of web, queue and scheduler (top level, so every service can use the anchor)
x-environment: &environment
  APP_NAME: Stocks
  APP_ENV: '${APP_ENV:-production}'
  APP_KEY: '${APP_KEY}'
  APP_DEBUG: '${APP_DEBUG:-false}'
  APP_URL: '${APP_URL}'
  APP_FORCE_HTTPS: '${APP_FORCE_HTTPS:-true}'
  APP_LOCALE: de
  # times of loans are entered and printed in this time zone
  APP_TIMEZONE: '${APP_TIMEZONE:-Europe/Berlin}'
  SETUP_TOKEN: '${SETUP_TOKEN}'
  OCTANE_HTTPS: '${OCTANE_HTTPS:-true}'
  OCTANE_WORKERS: '${OCTANE_WORKERS:-auto}'
  OCTANE_MAX_REQUESTS: '${OCTANE_MAX_REQUESTS:-500}'
  LOG_CHANNEL: stderr
  LOG_LEVEL: '${LOG_LEVEL:-warning}'
  DB_CONNECTION: mysql
  DB_HOST: mariadb
  DB_PORT: 3306
  DB_DATABASE: stocks
  DB_USERNAME: stocks
  DB_PASSWORD: '${DB_PASSWORD}'
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  # notifications go through the queue (service "queue"), see documentation/NOTIFICATIONS.md
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PASSWORD: '${REDIS_PASSWORD}'
  REDIS_PORT: 6379
  MAIL_MAILER: '${MAIL_MAILER:-smtp}'
  MAIL_HOST: '${MAIL_HOST}'
  MAIL_PORT: '${MAIL_PORT:-587}'
  MAIL_USERNAME: '${MAIL_USERNAME}'
  MAIL_PASSWORD: '${MAIL_PASSWORD}'
  MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS}'
  MAIL_FROM_NAME: '${MAIL_FROM_NAME:-Stocks}'
  # web push, created once with "php artisan webpush:vapid"; empty: no push, only mails
  VAPID_PUBLIC_KEY: '${VAPID_PUBLIC_KEY:-}'
  VAPID_PRIVATE_KEY: '${VAPID_PRIVATE_KEY:-}'
  VAPID_SUBJECT: '${VAPID_SUBJECT:-}'
  # photos of items on S3, by default the MinIO below
  AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-minioadmin}'
  AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-minioadmin123}'
  AWS_DEFAULT_REGION: '${AWS_DEFAULT_REGION:-us-east-1}'
  AWS_BUCKET: '${AWS_BUCKET:-stocks}'
  AWS_ENDPOINT: '${AWS_ENDPOINT:-http://minio:9000}'
  AWS_USE_PATH_STYLE_ENDPOINT: '${AWS_USE_PATH_STYLE_ENDPOINT:-true}'

services:
  web:
    image: '${STOCKS_IMAGE:-ghcr.io/fsr5-fhaachen/stocks:latest}'
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      # migrations run on start, so the database has to accept connections first
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment: *environment
    ports:
      - '${WEB_PORT:-8000}:8000'
    networks:
      - stocks
  # sends the queued notifications (mails, push); same image and environment as "web"
  queue:
    image: '${STOCKS_IMAGE:-ghcr.io/fsr5-fhaachen/stocks:latest}'
    restart: unless-stopped
    depends_on:
      - web
    environment: *environment
    command: php artisan queue:work --tries=3 --max-time=3600
    healthcheck:
      disable: true
    networks:
      - stocks
  # runs the time plan: reminders of loans every 15 minutes, cleaning up once a day
  scheduler:
    image: '${STOCKS_IMAGE:-ghcr.io/fsr5-fhaachen/stocks:latest}'
    restart: unless-stopped
    depends_on:
      - web
    environment: *environment
    command: php artisan schedule:work
    healthcheck:
      disable: true
    networks:
      - stocks
  redis:
    image: redis
    restart: unless-stopped
    command: redis-server --requirepass '${REDIS_PASSWORD}'
    networks:
      - stocks
  mariadb:
    image: mariadb
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: stocks
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MARIADB_USER: stocks
      MARIADB_PASSWORD: '${DB_PASSWORD}'
    # healthy once InnoDB is ready and connections are accepted (script ships with the image)
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mariadb:/var/lib/mysql/
    networks:
      - stocks

  # S3 storage for the photos, taken from Portals (feat/missing-s3-service)
  minio:
    image: ghcr.io/coollabsio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3-API
      - "9001:9001"   # Web-Konsole
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - stocks

  # creates the bucket once MinIO is ready and exits (exit status 0 is expected)
  minio-setup:
    image: amazon/aws-cli:latest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${AWS_BUCKET:-stocks}
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3 ls; do sleep 1; done;
      aws --endpoint-url http://minio:9000 s3 mb s3://$$BUCKET || true
      "
    networks:
      - stocks
networks:
  stocks:
volumes:
  mariadb:
  minio_data:
