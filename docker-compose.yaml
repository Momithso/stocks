# One Stocks instance. Every value that differs between instances comes from the .env file next
# to this file, see documentation/SETUP.md.
services:
  web:
    image: ghcr.io/momithso/stocks:latest
    restart: unless-stopped
    depends_on:
      - redis
      - mariadb
    environment:
      APP_NAME: Stocks
      APP_ENV: '${APP_ENV:-production}'
      APP_KEY: '${APP_KEY}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      APP_URL: '${APP_URL}'
      APP_FORCE_HTTPS: '${APP_FORCE_HTTPS:-true}'
      APP_LOCALE: de
      SETUP_TOKEN: '${SETUP_TOKEN}'
      OCTANE_HTTPS: '${OCTANE_HTTPS:-true}'
      OCTANE_WORKERS: '${OCTANE_WORKERS:-auto}'
      OCTANE_MAX_REQUESTS: '${OCTANE_MAX_REQUESTS:-500}'
      LOG_CHANNEL: stderr
      LOG_LEVEL: '${LOG_LEVEL:-warning}'
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: stocks
      DB_USERNAME: stocks
      DB_PASSWORD: '${DB_PASSWORD}'
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      REDIS_PORT: 6379
      MAIL_MAILER: '${MAIL_MAILER:-smtp}'
      MAIL_HOST: '${MAIL_HOST}'
      MAIL_PORT: '${MAIL_PORT:-587}'
      MAIL_USERNAME: '${MAIL_USERNAME}'
      MAIL_PASSWORD: '${MAIL_PASSWORD}'
      MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS}'
      MAIL_FROM_NAME: '${MAIL_FROM_NAME:-Stocks}'
    ports:
      - '${WEB_PORT:-8000}:8000'
    networks:
      - stocks
  redis:
    image: redis
    restart: unless-stopped
    command: redis-server --requirepass '${REDIS_PASSWORD}'
    networks:
      - stocks
  mariadb:
    image: mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: stocks
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MARIADB_USER: stocks
      MARIADB_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - mariadb:/var/lib/mysql/
    networks:
      - stocks
networks:
  stocks:
volumes:
  mariadb:
