services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            NODE_VERSION: '24'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mariadb
            - redis
            - minio
    mariadb:
        image: 'mariadb:11'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MARIADB_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MARIADB_DATABASE: '${DB_DATABASE:-stocks}'
            MARIADB_USER: '${DB_USERNAME:-stocks}'
            MARIADB_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-mariadb:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - '--connect'
                - '--innodb_initialized'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    # S3 for the photos of items, the same MinIO as in docker-compose.yaml (taken from Portals)
    minio:
        image: 'ghcr.io/coollabsio/minio:latest'
        command: 'server /data --console-address ":9001"'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001'
        environment:
            MINIO_ROOT_USER: '${AWS_ACCESS_KEY_ID:-minioadmin}'
            MINIO_ROOT_PASSWORD: '${AWS_SECRET_ACCESS_KEY:-minioadmin123}'
        volumes:
            - 'sail-minio:/data'
        networks:
            - sail
    # creates the bucket once MinIO is ready and exits (exit status 0 is expected)
    minio-setup:
        image: 'amazon/aws-cli:latest'
        depends_on:
            - minio
        environment:
            AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-minioadmin}'
            AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-minioadmin123}'
            AWS_DEFAULT_REGION: us-east-1
            BUCKET: '${AWS_BUCKET:-stocks}'
        entrypoint: >
            /bin/sh -c "
            until aws --endpoint-url http://minio:9000 s3 ls; do sleep 1; done;
            aws --endpoint-url http://minio:9000 s3 mb s3://$$BUCKET || true
            "
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mariadb:
        driver: local
    sail-redis:
        driver: local
    sail-minio:
        driver: local
